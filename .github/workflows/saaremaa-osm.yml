name: Import Saaremaa surroundings and coastline
on:
  push:
    branches: [saaremaa-gis-toomalouka-2025]
    paths: ['.github/workflows/saaremaa-osm.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install shapely
      - run: python3 saaremaa_real_gis/fetch_coast.py
        continue-on-error: true
      - name: Commit fetched coast without changing game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add saaremaa_real_gis/osm_coastline_local.json saaremaa_real_gis/COAST_REPORT.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'Add mapped Saaremaa coastlines' && git push origin HEAD:saaremaa-gis-toomalouka-2025)
